Git에서 브랜치를 만드는 방법을 알려드리겠습니다.

## Git 브랜치 생성 방법

### 1. 새 브랜치 생성 (체크아웃하지 않음)

```bash
# 새 브랜치 생성만 (현재 브랜치에 머물러 있음)
git branch feature/new-feature

# 브랜치 목록 확인
git branch
```

### 2. 새 브랜치 생성 후 바로 체크아웃

```bash
# 새 브랜치 생성하고 바로 이동
git checkout -b feature/new-feature

# 또는 최신 Git 버전에서는
git switch -c feature/new-feature
```

### 3. 특정 커밋에서 브랜치 생성

```bash
# 특정 커밋 해시에서 브랜치 생성
git checkout -b feature/new-feature abc1234

# 또는
git switch -c feature/new-feature abc1234
```

### 4. 원격 브랜치에서 로컬 브랜치 생성

```bash
# 원격 브랜치를 추적하는 로컬 브랜치 생성
git checkout -b local-branch-name origin/remote-branch-name

# 또는
git switch -c local-branch-name origin/remote-branch-name
```

## 브랜치 관리 명령어

### 브랜치 목록 확인

```bash
# 로컬 브랜치 목록
git branch

# 원격 브랜치 포함 목록
git branch -a

# 원격 브랜치만 확인
git branch -r
```

### 브랜치 이동

```bash
# 기존 브랜치로 이동
git checkout main
git checkout feature/new-feature

# 또는 최신 방식
git switch main
git switch feature/new-feature
```

### 브랜치 삭제

```bash
# 로컬 브랜치 삭제 (안전한 삭제)
git branch -d feature/old-feature

# 강제 삭제
git branch -D feature/old-feature

# 원격 브랜치 삭제
git push origin --delete feature/old-feature
```

## 실제 사용 예시

### 1. 기능 개발용 브랜치 생성

```bash
# 메인 브랜치에서 새 기능 브랜치 생성
git checkout main
git pull origin main
git checkout -b feature/user-authentication

# 작업 후 커밋
git add .
git commit -m "사용자 인증 기능 추가"
```

### 2. 버그 수정용 브랜치 생성

```bash
# 버그 수정 브랜치 생성
git checkout -b bugfix/login-error

# 수정 후 커밋
git add .
git commit -m "로그인 오류 수정"
```

### 3. 브랜치명 규칙

```bash
# 일반적인 브랜치명 규칙
feature/기능명          # 새 기능 개발
bugfix/버그명           # 버그 수정
hotfix/긴급수정명       # 긴급 수정
release/버전명          # 릴리스 준비
```

## 브랜치 병합

### 1. Fast-forward 병합

```bash
# 메인 브랜치로 이동
git checkout main

# 브랜치 병합
git merge feature/new-feature
```

### 2. Pull Request/Merge Request 사용

```bash
# 원격 저장소에 브랜치 푸시
git push origin feature/new-feature

# GitHub/GitLab에서 Pull Request 생성
```

## 브랜치 전략 예시

### Git Flow 방식

```bash
# 개발 브랜치에서 기능 브랜치 생성
git checkout develop
git checkout -b feature/new-feature

# 작업 완료 후 develop에 병합
git checkout develop
git merge feature/new-feature
```

### GitHub Flow 방식

```bash
# 메인 브랜치에서 직접 기능 브랜치 생성
git checkout main
git checkout -b feature/new-feature

# 작업 완료 후 Pull Request 생성
git push origin feature/new-feature
```
Git에서 브랜치 히스토리를 보존하면서 merge하는 방법을 알려드리겠습니다.

현재 상황을 보면 `git merge branch01`을 사용했을 때 fast-forward merge가 발생해서 브랜치 히스토리가 사라진 것 같습니다. 이를 해결하는 방법들을 제시해드리겠습니다:

## 1. Merge Commit 생성하기 (가장 추천)

```bash
# 현재 main 브랜치에서
git merge --no-ff branch01
```

`--no-ff` 옵션을 사용하면 fast-forward merge를 방지하고 merge commit을 생성합니다.

## 2. 이미 merge된 경우 되돌리고 다시 merge

```bash
# 마지막 merge를 되돌리기 (merge commit이 있는 경우)
git reset --hard HEAD~1

# 또는 특정 커밋으로 되돌리기
git reset --hard <merge하기 전 커밋 해시>

# 그 후 --no-ff로 다시 merge
git merge --no-ff branch01
```

## 3. Git 설정으로 기본 동작 변경

```bash
# 항상 merge commit을 생성하도록 설정
git config --global merge.ff false

# 또는 현재 프로젝트에만 적용
git config merge.ff false
```

## 4. Merge 메시지와 함께

```bash
git merge --no-ff -m "Merge branch 'branch01' into main" branch01
```

## 결과

이렇게 하면 git graph에서 다음과 같이 보입니다:

```
*   Merge branch 'branch01' into main (merge commit)
|\
| * branch01의 커밋들
| * 
|/
* main의 이전 커밋들
```

## 추천 방법

가장 좋은 방법은 **`git merge --no-ff branch01`**입니다. 이렇게 하면:

- 브랜치 히스토리가 보존됩니다
- Pull Request처럼 브랜치가 합쳐지는 모양이 남습니다
- 나중에 어떤 기능이 언제 추가되었는지 추적하기 쉽습니다

이미 merge를 했다면 `git reset`으로 되돌린 후 `--no-ff` 옵션으로 다시 merge하시면 됩니다.

