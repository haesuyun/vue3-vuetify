Git에서 브랜치를 만드는 방법을 알려드리겠습니다.

## Git 브랜치 생성 방법

### 1. 새 브랜치 생성 (체크아웃하지 않음)

```bash
# 새 브랜치 생성만 (현재 브랜치에 머물러 있음)
git branch feature/new-feature

# 브랜치 목록 확인
git branch
```

### 2. 새 브랜치 생성 후 바로 체크아웃

```bash
# 새 브랜치 생성하고 바로 이동
git checkout -b feature/new-feature

# 또는 최신 Git 버전에서는
git switch -c feature/new-feature
```

### 3. 특정 커밋에서 브랜치 생성

```bash
# 특정 커밋 해시에서 브랜치 생성
git checkout -b feature/new-feature abc1234

# 또는
git switch -c feature/new-feature abc1234
```

### 4. 원격 브랜치에서 로컬 브랜치 생성

```bash
# 원격 브랜치를 추적하는 로컬 브랜치 생성
git checkout -b local-branch-name origin/remote-branch-name

# 또는
git switch -c local-branch-name origin/remote-branch-name
```

## 브랜치 관리 명령어

### 브랜치 목록 확인

```bash
# 로컬 브랜치 목록
git branch

# 원격 브랜치 포함 목록
git branch -a

# 원격 브랜치만 확인
git branch -r
```

### 브랜치 이동

```bash
# 기존 브랜치로 이동
git checkout main
git checkout feature/new-feature

# 또는 최신 방식
git switch main
git switch feature/new-feature
```

### 브랜치 삭제

```bash
# 로컬 브랜치 삭제 (안전한 삭제)
git branch -d feature/old-feature

# 강제 삭제
git branch -D feature/old-feature

# 원격 브랜치 삭제
git push origin --delete feature/old-feature
```

## 실제 사용 예시

### 1. 기능 개발용 브랜치 생성

```bash
# 메인 브랜치에서 새 기능 브랜치 생성
git checkout main
git pull origin main
git checkout -b feature/user-authentication

# 작업 후 커밋
git add .
git commit -m "사용자 인증 기능 추가"
```

### 2. 버그 수정용 브랜치 생성

```bash
# 버그 수정 브랜치 생성
git checkout -b bugfix/login-error

# 수정 후 커밋
git add .
git commit -m "로그인 오류 수정"
```

### 3. 브랜치명 규칙

```bash
# 일반적인 브랜치명 규칙
feature/기능명          # 새 기능 개발
bugfix/버그명           # 버그 수정
hotfix/긴급수정명       # 긴급 수정
release/버전명          # 릴리스 준비
```

## 브랜치 병합

### 1. Fast-forward 병합

```bash
# 메인 브랜치로 이동
git checkout main

# 브랜치 병합
git merge feature/new-feature
```

### 2. Pull Request/Merge Request 사용

```bash
# 원격 저장소에 브랜치 푸시
git push origin feature/new-feature

# GitHub/GitLab에서 Pull Request 생성
```

## 브랜치 전략 예시

### Git Flow 방식

```bash
# 개발 브랜치에서 기능 브랜치 생성
git checkout develop
git checkout -b feature/new-feature

# 작업 완료 후 develop에 병합
git checkout develop
git merge feature/new-feature
```

### GitHub Flow 방식

```bash
# 메인 브랜치에서 직접 기능 브랜치 생성
git checkout main
git checkout -b feature/new-feature

# 작업 완료 후 Pull Request 생성
git push origin feature/new-feature
```
